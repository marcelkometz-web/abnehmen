<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund Gradient (Dark Theme passend zur App) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    
    <!-- Blatt Gradient (Leuchtendes GartenMutti-Grün) -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    
    <!-- Eleganter 3D-Schatten für Tiefe -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App-Hintergrund (Squircle / abgerundetes Viereck) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <g filter="url(#dropShadow)">
    <!-- Gabel (Modern, Silber/Weiß) -->
    <!-- Zinken -->
    <rect x="194" y="140" width="28" height="110" rx="14" fill="#f5f5f4" />
    <rect x="242" y="130" width="28" height="140" rx="14" fill="#f5f5f4" />
    <rect x="290" y="140" width="28" height="110" rx="14" fill="#f5f5f4" />
    <!-- U-Bogen der Gabel -->
    <path d="M 208 220 C 208 280, 304 280, 304 220" fill="none" stroke="#f5f5f4" stroke-width="28" stroke-linecap="round" />
    <!-- Stiel der Gabel -->
    <rect x="242" y="270" width="28" height="140" rx="14" fill="#f5f5f4" />

    <!-- Blatt (Grün, rankt sich um den Stiel) -->
    <!-- Dynamische Blattform -->
    <path d="M 256 330 C 370 340, 440 250, 420 130 C 320 120, 240 200, 256 330 Z" fill="url(#leafGrad)" />
    <!-- Blattader -->
    <path d="M 256 330 Q 330 250, 400 150" fill="none" stroke="#1c1917" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
